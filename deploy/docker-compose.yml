name: panelist

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: panelist
      POSTGRES_PASSWORD: panelist
      POSTGRES_DB: panelist
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panelist -d panelist"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3.5
    environment:
      SERVICES: s3,ec2,iam,sts,secretsmanager,logs
      EAGER_SERVICE_LOADING: "1"
    ports:
      - "4569:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": \"\\(running\\|available\\)\"'"]
      interval: 3s
      timeout: 5s
      retries: 40

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://panelist:panelist@postgres:5432/panelist
      DELIVERY_S3_BUCKET: panelist-deliveries
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn panelist.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
